name: build

# Build, test and check formatting on every push and pull request.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle downloads between runs and checks the wrapper jar is genuine.
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build
